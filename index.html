<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NALC Volume 1 Examination (Units 1-15)</title>
    <style>
        :root {
            --bg: #121212;
            --surface: #1e1e1e;
            --primary: #bb86fc;
            --text: #e0e0e0;
            --border: #333333;
            --success: #03dac6;
            --error: #cf6679;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 750px;
            width: 100%;
            background: var(--surface);
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border: 1px solid var(--border);
        }

        h1 {
            color: var(--primary);
            text-align: center;
            margin-top: 0;
        }

        .progress-bar {
            width: 100%;
            background-color: var(--border);
            height: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background-color: var(--primary);
            width: 0%;
            transition: width 0.3s ease;
        }

        .question-meta {
            font-size: 0.9em;
            color: #aaa;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .question-text {
            font-size: 1.2em;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .audio-btn {
            background-color: var(--primary);
            color: #000;
            border: none;
            padding: 10px 18px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            margin-bottom: 20px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .audio-btn:hover {
            opacity: 0.9;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background-color: #2a2a2a;
            color: var(--text);
            border: 1px solid var(--border);
            padding: 14px 18px;
            text-align: left;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1em;
            transition: background-color 0.2s;
        }

        .option-btn:hover {
            background-color: #383838;
        }

        .controls {
            margin-top: 25px;
            display: flex;
            justify-content: space-between;
        }

        .btn {
            background-color: transparent;
            color: var(--primary);
            border: 1px solid var(--primary);
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1em;
        }

        .btn:hover {
            background-color: rgba(187, 134, 252, 0.1);
        }

        .hidden {
            display: none !important;
        }

        #results-container {
            text-align: center;
        }

        .score-display {
            font-size: 2.5em;
            color: var(--success);
            margin: 20px 0;
        }

        .status-msg {
            font-size: 0.9em;
            color: #888;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>NALC Examination Portal</h1>
    
    <div id="quiz-ui">
        <div class="progress-bar">
            <div id="progress" class="progress-fill"></div>
        </div>
        
        <div id="question-meta" class="question-meta">Item 1 of 50 | Listening Section</div>
        
        <button id="audio-trigger" class="audio-btn" onclick="playAudioPrompt()">
            🔊 Play Audio Prompt
        </button>
        
        <div id="question-text" class="question-text">Loading question...</div>
        
        <div id="options-grid" class="options-grid"></div>
        
        <div class="controls">
            <button id="next-btn" class="btn" onclick="nextQuestion()">Next Item &rarr;</button>
        </div>
    </div>

    <div id="results-container" class="hidden">
        <h2>Examination Completed</h2>
        <p>Your test score has been compiled.</p>
        <div id="score-display" class="score-display">0 / 50</div>
        <div id="status-msg" class="status-msg">Transmitting results to evaluator...</div>
    </div>
</div>

<script>
    const examItems = [
        // --- 25 Listening Items (Speech Synthesis Prompts) ---
        { type: 'listening', prompt: "Listen to the statement: The laboratory opens at 0800 hours.", question: "What time does the laboratory open?", options: ["0800 hours", "0830 hours", "1800 hours", "0700 hours"], answer: 0 },
        { type: 'listening', prompt: "Listen: Major Miller wants to verify the attendance roster.", question: "What does the officer want to verify?", options: ["The daily briefing schedule", "The attendance roster", "The classroom assignment", "The examination results"], answer: 1 },
        { type: 'listening', prompt: "Listen: The buses leave for the main campus at 0730.", question: "Where are the buses heading at 0730?", options: ["To the airfield", "To the language lab", "To the main campus", "To the cafeteria"], answer: 2 },
        { type: 'listening', prompt: "Listen: Turn off the computer display before leaving the room.", question: "What instruction was given?", options: ["Lock the main door", "Turn off the computer display", "Clean the desk surface", "Shut down the power grid"], answer: 1 },
        { type: 'listening', prompt: "Listen: Sergeant Davis is currently in Classroom B.", question: "Where is Sergeant Davis located?", options: ["Classroom A", "Classroom B", "The administrative office", "The library"], answer: 1 },
        { type: 'listening', prompt: "Listen: All trainees must submit their workbooks by Friday.", question: "When are the workbooks due?", options: ["Thursday", "Friday", "Monday", "Wednesday"], answer: 1 },
        { type: 'listening', prompt: "Listen: The weather forecast predicts heavy rain tomorrow morning.", question: "What is expected tomorrow morning?", options: ["High winds", "Heavy rain", "Dense fog", "Clear skies"], answer: 1 },
        { type: 'listening', prompt: "Listen: Please place your answer sheets on the front table.", question: "Where should the answer sheets be placed?", options: ["On the instructor's desk", "On the front table", "In your folder", "Near the doorway"], answer: 1 },
        { type: 'listening', prompt: "Listen: The library closes early on Saturday afternoons.", question: "What happens on Saturday afternoons?", options: ["The library opens late", "The library closes early", "The library remains open", "The library is closed all day"], answer: 1 },
        { type: 'listening', prompt: "Listen: Captain Torres completed the advanced training program.", question: "Who completed the advanced training program?", options: ["Lieutenant Miller", "Captain Torres", "Sergeant Davis", "Major Wilson"], answer: 1 },
        { type: 'listening', prompt: "Listen: Trainees should practice their pronunciation daily.", question: "What should trainees do daily?", options: ["Review their notes", "Practice their pronunciation", "Write short essays", "Complete online exercises"], answer: 1 },
        { type: 'listening', prompt: "Listen: The main office is on the third floor of the building.", question: "Where is the main office located?", options: ["First floor", "Second floor", "Third floor", "Ground floor"], answer: 2 },
        { type: 'listening', prompt: "Listen: The morning formation takes place outside the headquarters.", question: "Where is the morning formation?", options: ["Inside the auditorium", "Outside the headquarters", "Near the parking lot", "In the main courtyard"], answer: 1 },
        { type: 'listening', prompt: "Listen: Coffee and tea are provided in the break room.", question: "What is available in the break room?", options: ["Water and juice", "Coffee and tea", "Snacks and fruit", "Soft drinks"], answer: 1 },
        { type: 'listening', prompt: "Listen: Please write your full name at the top of the test paper.", question: "What must be written at the top of the paper?", options: ["Student ID number", "Full name", "Current date", "Unit designation"], answer: 1 },
        { type: 'listening', prompt: "Listen: The language lab equipement was upgraded last week.", question: "What happened last week?", options: ["The lab was repainted", "Equipment was upgraded", "New instructors arrived", "Class schedules changed"], answer: 1 },
        { type: 'listening', prompt: "Listen: Visitors must register at the security desk upon arrival.", question: "What must visitors do when they arrive?", options: ["Show their passport", "Register at the security desk", "Wait in the lobby", "Call their sponsor"], answer: 1 },
        { type: 'listening', prompt: "Listen: The evening study session begins at 1900 hours.", question: "What time does the study session start?", options: ["1800 hours", "1830 hours", "1900 hours", "1930 hours"], answer: 2 },
        { type: 'listening', prompt: "Listen: All mobile phones must be switched off during the exam.", question: "What is required regarding mobile phones?", options: ["Keep them on silent", "Switch them off completely", "Place them face down", "Leave them in your bag"], answer: 1 },
        { type: 'listening', prompt: "Listen: The cafeteria serves breakfast from 0630 to 0800.", question: "When is breakfast available?", options: ["0600 to 0730", "0630 to 0800", "0700 to 0830", "0730 to 0900"], answer: 1 },
        { type: 'listening', prompt: "Listen: Instructor Vance assigned three chapters for reading.", question: "How many chapters were assigned?", options: ["Two chapters", "Three chapters", "Four chapters", "Five chapters"], answer: 1 },
        { type: 'listening', prompt: "Listen: The evaluation covers Units 1 through 15.", question: "What material does the evaluation cover?", options: ["Units 1 through 10", "Units 5 through 15", "Units 1 through 15", "Units 10 through 20"], answer: 2 },
        { type: 'listening', prompt: "Listen: Ensure all window blinds are closed before departing.", question: "What should be done before departing?", options: ["Lock all doors", "Close all window blinds", "Turn off air conditioning", "Clean the whiteboards"], answer: 1 },
        { type: 'listening', prompt: "Listen: The next module starts on the first Monday of next month.", question: "When does the next module start?", options: ["Next Tuesday", "First Monday of next month", "End of this week", "In two weeks"], answer: 1 },
        { type: 'listening', prompt: "Listen: Student feedback forms are collected at the end of the course.", question: "When are feedback forms collected?", options: ["After each lesson", "At the end of the course", "Midway through the term", "During registration"], answer: 1 },

        // --- 25 Reading Items ---
        { type: 'reading', prompt: null, question: "Choose the correct sentence using personal pronouns:", options: ["She is a student at the language school.", "Her is a student at the language school.", "Hers is a student at the language school.", "She am a student at the language school."], answer: 0 },
        { type: 'reading', prompt: null, question: "Select the correct plural noun: 'There are three ___ in the parking lot.'", options: ["buses", "bus", "buss", "buseses"], answer: 0 },
        { type: 'reading', prompt: null, question: "Choose the demonstrative pronoun: '___ is my book here on the desk.'", options: ["This", "These", "Those", "Them"], answer: 0 },
        { type: 'reading', prompt: null, question: "Identify the correct negative statement:", options: ["The instructor does not speak English well.", "The instructor no speak English well.", "The instructor not speaks English well.", "The instructor isn't speak English well."], answer: 0 },
        { type: 'reading', prompt: null, question: "Choose the correct question format for telling time:", options: ["What time is it?", "How much time it is?", "What time it has?", "Which time is now?"], answer: 0 },
        { type: 'reading', prompt: null, question: "Select the present continuous form:", options: ["They are studying vocabulary in the classroom now.", "They studied vocabulary in the classroom now.", "They study vocabulary in the classroom now.", "They will study vocabulary in the classroom now."], answer: 0 },
        { type: 'reading', prompt: null, question: "Choose the preposition: 'The maps are hanging ___ the wall.'", options: ["on", "in", "at", "under"], answer: 0 },
        { type: 'reading', prompt: null, question: "Select the modal verb of ability:", options: ["He can speak two languages fluently.", "He must to speak two languages fluently.", "He should speaking two languages fluently.", "He may speaks two languages fluently."], answer: 0 },
        { type: 'reading', prompt: null, question: "Choose the possessive adjective for 'We': '___ classroom is clean.'", options: ["Our", "We", "Us", "Ours"], answer: 0 },
        { type: 'reading', prompt: null, question: "Identify the past tense form: 'Yesterday, she ___ to the laboratory.'", options: ["went", "go", "gone", "going"], answer: 0 },
        { type: 'reading', prompt: null, question: "Complete the sentence: 'The trainees ___ mandatory formation every morning.'", options: ["attend", "attends", "attending", "was attended"], answer: 0 },
        { type: 'reading', prompt: null, question: "Select the antonym for the adjective 'difficult':", options: ["easy", "hard", "complex", "tough"], answer: 0 },
        { type: 'reading', prompt: null, question: "Choose the correct comparative form: 'This test is ___ than the previous one.'", options: ["easier", "more easy", "easiest", "easyer"], answer: 0 },
        { type: 'reading', prompt: null, question: "Identify the correct imperative command:", options: ["Open your booklets to page ten.", "Opening your booklets to page ten.", "You to open your booklets to page ten.", "Opened your booklets to page ten."], answer: 0 },
        { type: 'reading', prompt: null, question: "Select the sentence with correct word order:", options: ["He rarely arrives late for morning briefing.", "He arrives late rarely for morning briefing.", "Rarely he late arrives for morning briefing.", "Arrives he rarely late for morning briefing."], answer: 0 },
        { type: 'reading', prompt: null, question: "Choose the correct frequency adverb placement:", options: ["She always checks her work before submitting.", "She checks always her work before submitting.", "Always she checks her work before submitting.", "She checks her work before submitting always."], answer: 0 },
        { type: 'reading', prompt: null, question: "Complete with the correct preposition: 'The briefing starts ___ 0800 hours.'", options: ["at", "on", "in", "by"], answer: 0 },
        { type: 'reading', prompt: null, question: "Identify the correct future tense expression:", options: ["We will complete the module next week.", "We completing the module next week.", "We completed the module next week.", "We complete the module next week."], answer: 0 },
        { type: 'reading', prompt: null, question: "Choose the correct plural form of 'person':", options: ["people", "persons", "peoples", "persones"], answer: 0 },
        { type: 'reading', prompt: null, question: "Select the correct article: 'He is ___ experienced flight instructor.'", options: ["an", "a", "the", "no article needed"], answer: 0 },
        { type: 'reading', prompt: null, question: "Choose the correct sentence:", options: ["There are many books in the storage unit.", "There is many books in the storage unit.", "There be many books in the storage unit.", "There has many books in the storage unit."], answer: 0 },
        { type: 'reading', prompt: null, question: "Complete with the correct pronoun: 'Major Harris called ___ into the office.'", options: ["him", "he", "his", "himself"], answer: 0 },
        { type: 'reading', prompt: null, question: "Select the sentence expressing necessity:", options: ["Trainees must wear their identification badges at all times.", "Trainees can wear their identification badges at all times.", "Trainees may wear their identification badges at all times.", "Trainees might wear their identification badges at all times."], answer: 0 },
        { type: 'reading', prompt: null, question: "Choose the correct conjunction: 'He studied hard, ___ he passed the exam.'", options: ["so", "because", "but", "although"], answer: 0 },
        { type: 'reading', prompt: null, question: "Identify the passive voice structure:", options: ["The examination papers were graded by the board.", "The board graded the examination papers.", "The board is grading the examination papers.", "The board will grade the examination papers."], answer: 0 }
    ];

    let currentIdx = 0;
    let score = 0;
    let selectedOptions = new Array(examItems.length).fill(null);

    const synth = window.speechSynthesis;

    function renderQuestion() {
        const item = examItems[currentIdx];
        
        // Update Progress & Metadata
        document.getElementById('progress').style.width = ((currentIdx + 1) / examItems.length * 100) + '%';
        document.getElementById('question-meta').innerText = `Item ${currentIdx + 1} of ${examItems.length} | ${item.type === 'listening' ? 'Listening Section' : 'Reading Section'}`;
        
        // Handle Speech Trigger Button Visibility
        const audioBtn = document.getElementById('audio-trigger');
        if (item.type === 'listening') {
            audioBtn.classList.remove('hidden');
        } else {
            audioBtn.classList.add('hidden');
        }

        // Render Question Text
        document.getElementById('question-text').innerText = item.question;

        // Render Answer Options
        const grid = document.getElementById('options-grid');
        grid.innerHTML = '';
        
        item.options.forEach((optText, i) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = `${String.fromCharCode(65 + i)}) ${optText}`;
            
            if (selectedOptions[currentIdx] === i) {
                btn.style.backgroundColor = '#bb86fc';
                btn.style.color = '#000000';
            }

            btn.onclick = () => selectOption(i);
            grid.appendChild(btn);
        });
    }

    function playAudioPrompt() {
        const item = examItems[currentIdx];
        if (item.type === 'listening' && item.prompt) {
            synth.cancel(); // Cancel any ongoing speech
            const utterance = new SpeechSynthesisUtterance(item.prompt);
            utterance.rate = 0.9;
            synth.speak(utterance);
        }
    }

    function selectOption(optIndex) {
        selectedOptions[currentIdx] = optIndex;
        renderQuestion();
    }

    function nextQuestion() {
        if (currentIdx < examItems.length - 1) {
            currentIdx++;
            renderQuestion();
        } else {
            finishExam();
        }
    }

    function finishExam() {
        // Calculate Score
        score = 0;
        selectedOptions.forEach((userAns, idx) => {
            if (userAns === examItems[idx].answer) {
                score++;
            }
        });

        // Hide Exam UI, Show Results UI
        document.getElementById('quiz-ui').classList.add('hidden');
        document.getElementById('results-container').classList.remove('hidden');
        document.getElementById('score-display').innerText = `${score} / ${examItems.length}`;

        // Send Score via FormSubmit directly to yavor40@gmail.com
        sendScoreToEmail(score);
    }

    function sendScoreToEmail(finalScore) {
        const statusElement = document.getElementById('status-msg');

        fetch("https://formsubmit.co/ajax/yavor40@gmail.com", {
            method: "POST",
            headers: { 
                'Content-Type': 'application/json',
                'Accept': 'application/json'
            },
            body: JSON.stringify({
                subject: "NALC Units 1-15 Exam Result",
                score: `${finalScore} / 50`,
                percentage: `${((finalScore / 50) * 100).toFixed(1)}%`,
                details: "Student completed the online 50-item NALC examination portal."
            })
        })
        .then(response => response.json())
        .then(data => {
            statusElement.innerText = "Results submitted to yavor40@gmail.com successfully.";
            statusElement.style.color = "var(--success)";
        })
        .catch(error => {
            console.error("Submission error:", error);
            statusElement.innerText = "Results compiled locally (Network submission issue).";
        });
    }

    // Initialize First Question
    renderQuestion();
</script>
</body>
</html>
